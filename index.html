<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>For Udi ❤️</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Montserrat:wght@400;700&family=Caveat:wght@700&display=swap" rel="stylesheet">
    
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            /* Use dvh (Dynamic Viewport Height) for better mobile support */
            height: 100dvh; 
            background: linear-gradient(45deg, #ff9a9e, #fad0c4, #ffd1ff, #fbc2eb);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden; 
            touch-action: none; 
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-container {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            width: 85%;
            max-width: 400px;
            z-index: 10;
        }

        .gif-container img {
            width: 120px; 
            margin-bottom: 20px;
            border-radius: 10px;
        }

        h1 {
            color: #d63384; 
            font-family: 'Dancing Script', cursive; 
            font-size: 2.2rem;
            margin: 0 0 20px 0;
            line-height: 1.2;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .buttons {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            position: relative;
            height: 60px; 
        }

        button {
            padding: 12px 25px;
            font-size: 1rem;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            font-family: 'Montserrat', sans-serif;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            transition: transform 0.1s ease; 
        }

        #yesBtn {
            background-color: #2ecc71; /* Green */
            color: white;
            z-index: 20; 
        }

        #noBtn {
            background-color: #e74c3c; /* Red */
            color: white;
            position: relative; 
            z-index: 9999; /* Super High Z-Index ensuring it floats on top */
        }
        
        /* --- Popup Styling --- */
        #customModal {
            display: none; 
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.6); 
            justify-content: center;
            align-items: center;
            z-index: 10000; /* Highest layer */
            backdrop-filter: blur(5px); 
        }

        .modal-content {
            background-color: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
            border: 4px solid #7f8c8d; 
            width: 80%;
            max-width: 300px;
            animation: popIn 0.3s ease-out;
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .modal-text {
            font-size: 1.5rem;
            color: #333;
            margin-bottom: 20px;
            font-family: 'Dancing Script', cursive; 
        }

        .sad-text {
            font-family: 'Caveat', cursive !important; 
            color: #333 !important; 
            font-size: 1.8rem !important;
            font-weight: bold;
            line-height: 1.3;
            animation: pulse 2s infinite; 
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .modal-btn {
            background-color: #e74c3c; 
            color: white;
            padding: 10px 25px;
            border-radius: 25px;
            border: none;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        .heart {
            position: fixed;
            top: -10vh;
            font-size: 1.5rem;
            animation: fall linear forwards;
            z-index: 99;
        }
        @keyframes fall {
            to { transform: translateY(110vh); }
        }
    </style>
</head>
<body>

    <div class="glass-container">
        <div class="gif-container">
            <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExMmo3c3l5ODh3ZGN6NHh4aDV0Ynh6M2l6OWxjMXBxeWJ6ZDM5MnZ5dyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/cLS1cfxvGOPVpf9g3y/giphy.gif" alt="Cute Bear">
        </div>

        <h1>Will you be my valentine? 🌹</h1>

        <div class="buttons">
            <button id="yesBtn" onclick="acceptLove()">Yes</button>
            <button id="noBtn">No</button>
        </div>
    </div>

    <div id="customModal">
        <div class="modal-content" id="modalContent">
            <p class="modal-text" id="modalText">Placeholder</p>
            <button class="modal-btn" id="modalBtn" onclick="closeModal()">No</button>
        </div>
    </div>

    <script>
        let hoverCount = 0;
        const noBtn = document.getElementById('noBtn');
        const modal = document.getElementById('customModal');
        const modalContent = document.getElementById('modalContent');
        const modalText = document.getElementById('modalText');
        const modalBtn = document.getElementById('modalBtn');

        function triggerMove(e) {
            if(e) e.preventDefault(); 

            hoverCount++;

            if (hoverCount === 10) {
                modalText.innerText = "Udi... are you really trying to break my heart? 💔";
                modalText.classList.add('sad-text'); 
                modalContent.style.border = "4px solid #7f8c8d"; 
                
                modalBtn.style.display = "inline-block"; 
                modal.style.display = "flex";
                hoverCount = 0; 
                return; 
            }

            // --- PERCENTAGE MATH (The Fix) ---
            // Instead of using pixels (which get messed up on phones),
            // We use 0 to 100 percent.
            
            // Generate random % for Left (between 10% and 85%)
            const randomX = Math.floor(Math.random() * 75) + 10;
            
            // Generate random % for Top (between 10% and 85%)
            const randomY = Math.floor(Math.random() * 75) + 10;

            // Apply using "Fixed" positioning
            noBtn.style.position = "fixed"; 
            noBtn.style.left = randomX + "%";
            noBtn.style.top = randomY + "%";
        }

        noBtn.addEventListener('mouseover', triggerMove);
        noBtn.addEventListener('touchstart', triggerMove);
        noBtn.addEventListener('click', triggerMove);

        function closeModal() {
            modal.style.display = "none";
            modalText.classList.remove('sad-text');
            modalContent.style.border = "4px solid #FFD700"; 
        }

        function acceptLove() {
            modalText.classList.remove('sad-text');
            modalContent.style.border = "4px solid #FFD700"; 
            
            modalText.innerHTML = "You just made me the happiest person in the world! ❤️";
            
            modalBtn.style.display = "none";
            modal.style.display = "flex";
            createHearts();
        }

        function createHearts() {
            const symbols = ['❤️', '💍', '🌸', '✨', '🧸']; 
            for (let i = 0; i < 60; i++) {
                const heart = document.createElement('div');
                heart.classList.add('heart');
                heart.innerText = symbols[Math.floor(Math.random() * symbols.length)];
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = Math.random() * 2 + 3 + 's'; 
                document.body.appendChild(heart);
                setTimeout(() => { heart.remove(); }, 5000);
            }
        }
    </script>
</body>

            modalText.classList.remove('sad-text');
            modalContent.style.border = "4px solid #FFD700"; 
            
            modalText.innerHTML = "You just made me the happiest person in the world! ❤️";
            
            modalBtn.style.display = "none";
            modal.style.display = "flex";
            createHearts();
        }

        function createHearts() {
            const symbols = ['❤️', '💍', '🌸', '✨', '🧸']; 
            for (let i = 0; i < 60; i++) {
                const heart = document.createElement('div');
                heart.classList.add('heart');
                heart.innerText = symbols[Math.floor(Math.random() * symbols.length)];
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = Math.random() * 2 + 3 + 's'; 
                document.body.appendChild(heart);
                setTimeout(() => { heart.remove(); }, 5000);
            }
        }
    </script>
</body>
</html>
